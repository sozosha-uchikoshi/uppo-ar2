<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ウッポ 〜靱公園のねむり番〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>
/* ---- tuning knobs (adjust on-device) ---- */
window.UPPO_CONFIG = {
  DEBUG:        false,    // false to hide the on-screen debug readout (set false for submission)
  STAGE_SCALE:  0.6,     // overall scene size on the marker (marker width = 1 unit)
  TARGET_H:     1.0,     // scale Uppo to this height on the marker
  NATIVE_H:     1.772,   // measured native height of uppo7.glb (fixed asset — no runtime measuring)
  NATIVE_MIN_Y: -0.887,  // native Y of the feet (model is centered on its origin)
  HEAD_Y_RATIO: 1.05,    // leaves sprout at TARGET_H * this
  ROTATE_X:     90,      // v13 flat-card use: 90 stands Uppo UP off a table card (view at a slight angle). Earlier +90 "failures" were the compositing bug (now fixed). If Uppo points DOWN into the table, switch to -90.
  ROTATE_Y:     0,       // 180 if Uppo faces away
  ROSE_RINGS: [ { r: 0.42, count: 6 }, { r: 0.68, count: 9 } ],

  /* ---- v15 additions (先生指示①②) ---- */
  LIFT:           0.5,    // ② 紙(マーカー)からの距離。大きいほど紙から浮く。逆に沈むならマイナス値に。
  SPIN_SENS:      0.011,  // ① 指スワイプの回転感度（ラジアン/px）
  DRAG_THRESH:    8,      // ① これ未満の指の移動は「タップ」扱い（起こす/リセット）
  AUTO_SPIN:      0.35,   // ① 放置中のゆっくり自動回転（ラジアン/秒）。0で自動回転オフ
  AUTO_RESUME_MS: 1400,   // ① 指を離してから自動回転が再開するまでの待ち(ms)
  BOB_AMP:        0.04,   // ① ふわふわ上下の振れ幅
  BOB_SPEED:      1.6,    // ① ふわふわ上下の速さ

  /* ---- スタンプ帳（A案） ---- */
  STAMP_KEY:  'uppo_stamps_v1',   // localStorage 保存キー
  STAMP_NAME: 'めざめの栞',         // 手に入る印の名前（好みで変更可）
  STAMP_SPOTS: [                  // 先頭=今回の旗艦スポット。以降=次フェーズ（近日）
    { id:'uppo',   name:'ウッポ（御神木）', live:true  },
    { id:'rose',   name:'バラ園',          live:false },
    { id:'keyaki', name:'ケヤキ並木',       live:false },
    { id:'hiroba', name:'西園ひろば',        live:false },
  ],
};

window.addEventListener('DOMContentLoaded', () => {
  const cfg = window.UPPO_CONFIG;
  const scene = document.querySelector('a-scene');
  const startBtn = document.getElementById('startBtn');
  const startScreen = document.getElementById('start');

  const applyCfg = () => {
    const stage = document.getElementById('stage');
    if (stage) {
      stage.setAttribute('rotation', `${cfg.ROTATE_X} ${cfg.ROTATE_Y} 0`);
      stage.setAttribute('scale', `${cfg.STAGE_SCALE} ${cfg.STAGE_SCALE} ${cfg.STAGE_SCALE}`);
      stage.setAttribute('position', `0 0 ${cfg.LIFT}`);   // ② 紙(マーカー法線=+Z)方向へ浮かせて距離をとる
    }
  };
  if (scene.hasLoaded) applyCfg(); else scene.addEventListener('loaded', applyCfg);

  // make the 3D canvas transparent so the camera feed is visible behind it
  const makeTransparent = () => {
    try { const r = scene.renderer; if (r) { r.setClearColor(0x000000, 0); r.setClearAlpha(0); } } catch (e) {}
  };
  scene.addEventListener('renderstart', makeTransparent);
  if (scene.renderer) makeTransparent();
  setTimeout(makeTransparent, 1500);

  // v12: force the 3D canvas to stack ABOVE MindAR's full-screen <video>.
  // MindAR appends the camera <video> at body level; without an explicit scene
  // z-index the video paints over the whole a-scene (canvas included) and hides
  // ALL 3D. Enforce order, and keep enforcing because MindAR restyles after start.
  const fixStack = () => {
    try {
      scene.style.position = 'fixed'; scene.style.inset = '0'; scene.style.zIndex = '1';
      const cv = scene.canvas || document.querySelector('.a-canvas');
      if (cv) { cv.style.position = 'absolute'; cv.style.inset = '0'; cv.style.zIndex = '1'; }
      document.querySelectorAll('video').forEach(v => {
        v.style.position = 'fixed'; v.style.top = '0'; v.style.left = '0';
        v.style.width = '100%'; v.style.height = '100%';
        v.style.objectFit = 'cover'; v.style.zIndex = '0';
      });
    } catch (e) {}
  };
  scene.addEventListener('renderstart', fixStack);
  let _fixN = 0;
  const _fixTimer = setInterval(() => { fixStack(); if ((_fixN += 1) > 20) clearInterval(_fixTimer); }, 400);

  // Gate "はじめる" until the scene + MindAR system are ready. The model is a ~3MB
  // download; on cellular it can still be loading when the user taps, which would
  // otherwise call sys.start() before MindAR exists and throw.
  let ready = false;
  const markReady = () => {
    if (ready) return;
    ready = true;
    startBtn.disabled = false;
    startBtn.innerHTML = 'はじめる<span class="k">カメラを ゆるして ください</span>';
  };
  startBtn.disabled = true;
  startBtn.innerHTML = '読み込み中…<span class="k">しばらく お待ちください</span>';
  if (scene.hasLoaded) markReady(); else scene.addEventListener('loaded', markReady);

  const startAR = () => {
    if (!ready) return;
    const sys = scene.systems['mindar-image-system'];
    if (!sys) { setTimeout(startAR, 300); return; }   // system not attached yet — wait
    startScreen.style.opacity = '0';
    setTimeout(() => { startScreen.style.display = 'none'; }, 400);
    try { sys.start(); }
    catch (e) { const d=document.getElementById('debug'); if(d){d.style.display='block'; d.textContent='start() エラー: '+e.message;} }
  };
  startBtn.addEventListener('click', startAR);
});

</script>
<script>
/* uppo-experience v5: 3-tier model measure + recentering fallback + reliable camera check */
AFRAME.registerComponent('uppo-experience', {
  init: function () {
    this.CFG    = window.UPPO_CONFIG;
    this.state  = 'idle';
    this.uppo   = this.el.querySelector('#uppo');
    this.leaves = this.el.querySelector('#leaves');
    this.roses  = this.el.querySelector('#roses');
    this.baseS  = null;
    this.spinY  = 0;       // ① 現在のウッポの回転角(ラジアン)
    this.footY  = 0;       // 足元の基準Y（ふわふわ上下の基準）
    this._down  = false;   // ① 指が触れているか
    this._moved = 0;       // ① 指の移動量（タップ/ドラッグ判定用）
    this._lastX = 0;
    this._autoResumeAt = 0;// ① 自動回転を再開する時刻
    this.dbg    = { AR:'初期化…', model:'読込中…', target:'—', state:'idle' };
    this._renderDbg();

    this._buildLeaves();
    this._buildRoses();

    this.uppo.addEventListener('model-loaded', () => this._onModelLoaded());
    this.uppo.addEventListener('model-error', () => this._set('model','読込エラー ✗ (uppo7.glb)'));

    const sc = this.el.sceneEl;
    sc.addEventListener('arError', () => this._set('AR','起動エラー ✗ (カメラ許可/対応を確認)'));

    // Reliable camera check: watch for the MindAR <video> actually producing frames.
    let waited = 0;
    this._camTimer = setInterval(() => {
      const v = document.querySelector('video');
      if (v && v.videoWidth > 0) { this._styleVideo(v); this._set('AR','カメラ起動 ✓'); clearInterval(this._camTimer); this._camTimer = null; }
      else if ((waited += 500) >= 9000) { this._set('AR','カメラ不可（許可/別ブラウザ要確認）'); clearInterval(this._camTimer); this._camTimer = null; }
    }, 500);

    this.el.addEventListener('targetFound', () => this.onFound());
    this.el.addEventListener('targetLost',  () => this.onLost());
    // ① 指操作：スワイプで回転 / 軽いタップは従来通り（起こす・リセット）
    this._onDown = (e) => { this._down = true; this._moved = 0; this._lastX = e.clientX; this._autoResumeAt = Infinity; };
    this._onMove = (e) => { if (!this._down) return;
      const dx = e.clientX - this._lastX; this._lastX = e.clientX; this._moved += Math.abs(dx);
      if (this.el.object3D.visible && this.baseS != null) this.spinY += dx * this.CFG.SPIN_SENS; };
    this._onUp   = () => { if (!this._down) return; this._down = false;
      this._autoResumeAt = performance.now() + this.CFG.AUTO_RESUME_MS;
      if (this._moved < this.CFG.DRAG_THRESH) this.onTap(); };
    window.addEventListener('pointerdown',   this._onDown);
    window.addEventListener('pointermove',   this._onMove);
    window.addEventListener('pointerup',     this._onUp);
    window.addEventListener('pointercancel', this._onUp);

    // スタンプ帳のボタン/シート（AR側のタップ・回転と誤爆しないよう pointer を止める）
    const sb=document.getElementById('stampBtn'),
          closeB=document.getElementById('stampClose'),
          sheet=document.getElementById('stampSheet');
    if(sb){ ['pointerdown','pointerup'].forEach(ev=>sb.addEventListener(ev,e=>e.stopPropagation())); sb.addEventListener('click',()=>this._openBook()); }
    if(closeB){ ['pointerdown','pointerup'].forEach(ev=>closeB.addEventListener(ev,e=>e.stopPropagation())); closeB.addEventListener('click',()=>this._closeBook()); }
    if(sheet){ ['pointerdown','pointerup'].forEach(ev=>sheet.addEventListener(ev,e=>e.stopPropagation())); sheet.addEventListener('click',(e)=>{ if(e.target===sheet) this._closeBook(); }); }
    this._refreshStampBtn();

    this._setHint('マーカーカードにかざしてね');
  },
  remove: function () {
    window.removeEventListener('pointerdown',   this._onDown);
    window.removeEventListener('pointermove',   this._onMove);
    window.removeEventListener('pointerup',     this._onUp);
    window.removeEventListener('pointercancel', this._onUp);
    if (this._camTimer) clearInterval(this._camTimer);
  },

  // Force MindAR's camera <video> to fill the screen BEHIND the transparent canvas.
  _styleVideo: function (v) {
    Object.assign(v.style, {
      position: 'fixed', top: '0', left: '0', right: '0', bottom: '0',
      width: '100%', height: '100%', objectFit: 'cover',
      display: 'block', visibility: 'visible', zIndex: '0',
    });
    // re-apply once more in case MindAR restyles after start
    setTimeout(() => Object.assign(v.style, { position:'fixed', width:'100%', height:'100%', objectFit:'cover', zIndex:'0' }), 1200);
  },

  // No runtime measuring: uppo7.glb is a fixed asset with a known native height,
  // so we scale by a constant. This removes the whole "自動計測不可" failure class.
  _onModelLoaded: function () {
    const C = this.CFG;
    const s = C.TARGET_H / C.NATIVE_H;              // normalize known height to TARGET_H
    this.baseS = s;
    this.uppo.object3D.scale.set(s, s, s);
    // model is centered on its origin in X/Z; lift so the feet (NATIVE_MIN_Y) rest on the marker (y=0)
    this.footY = -C.NATIVE_MIN_Y * s;
    this.uppo.object3D.position.set(0, this.footY, 0);
    this.leaves.object3D.position.y = C.TARGET_H * C.HEAD_Y_RATIO;   // leaves at the head
    this._set('model', 'OK ✓ (h=' + C.NATIVE_H.toFixed(2) + ' 固定)');
  },

  _buildLeaves: function () {
    const g = ['#7cb342','#8bc34a','#5f9a35','#98c85a','#6faa3c'];
    const t = [[0,0,0],[14,0,-8],[-12,0,10],[10,0,20],[-8,0,-22]];
    const hh= [0.42,0.34,0.34,0.28,0.28];
    for (let i=0;i<5;i++){ const l=document.createElement('a-entity');
      l.setAttribute('geometry',`primitive: cone; radiusBottom: 0.055; radiusTop: 0; height: ${hh[i]}; segmentsRadial: 8`);
      l.setAttribute('material',`color: ${g[i]}; roughness: 0.85; metalness: 0; flatShading: true`);
      l.setAttribute('position',`${(i-2)*0.02} ${hh[i]/2} 0`);
      l.setAttribute('rotation',`${t[i][0]} ${t[i][1]} ${t[i][2]}`);
      l.setAttribute('scale','0 0 0');
      l.setAttribute('animation__pop',`property: scale; from: 0 0 0; to: 1 1 1; dur: 460; easing: easeOutBack; startEvents: bloom; delay: ${i*70}`);
      l.setAttribute('animation__hide',`property: scale; to: 0 0 0; dur: 260; easing: easeInQuad; startEvents: hide`);
      this.leaves.appendChild(l);
    }
  },
  _buildRoses: function () {
    let order=0;
    this.CFG.ROSE_RINGS.forEach((ring,ri)=>{ for(let k=0;k<ring.count;k++){
      const ang=(k/ring.count)*Math.PI*2+ri*0.4;
      const jit=(Math.sin(order*12.9898)*43758.5453)%1;
      const r=ring.r+(jit-0.5)*0.06;
      const rose=document.createElement('a-entity');
      rose.setAttribute('position',`${Math.cos(ang)*r} 0.02 ${Math.sin(ang)*r}`);
      rose.setAttribute('scale','0 0 0');
      rose.setAttribute('animation__pop',`property: scale; from: 0 0 0; to: 1 1 1; dur: 520; easing: easeOutBack; startEvents: bloom; delay: ${200+order*45}`);
      rose.setAttribute('animation__hide',`property: scale; to: 0 0 0; dur: 260; easing: easeInQuad; startEvents: hide`);
      [{rad:0.07,h:0.018,y:0,c:'#c62439'},{rad:0.05,h:0.026,y:0.016,c:'#a71b2e'},{rad:0.03,h:0.026,y:0.032,c:'#7e1322'}].forEach(L=>{
        const p=document.createElement('a-cylinder');
        p.setAttribute('radius',L.rad); p.setAttribute('height',L.h);
        p.setAttribute('position',`0 ${L.y} 0`);
        p.setAttribute('material',`color: ${L.c}; roughness: 0.8; metalness: 0; flatShading: true`);
        rose.appendChild(p);
      });
      this.roses.appendChild(rose); order++;
    }});
  },

  onFound: function () {
    this._set('target','発見 ✓'); this.el.object3D.visible=true;
    if (this.state==='idle') this._toSleeping();
    this._setHint(this.state==='farewell'?'ゆびで回せる ・ もう一度タップ':'画面をタップして起こそう');
  },
  onLost: function () { this._set('target','ロスト'); },
  onTap: function () { if(this.state==='sleeping')this._wake(); else if(this.state==='farewell')this._reset(); },

  _toSleeping: function(){ this.state='sleeping'; this._set('state','sleeping'); this._setHint('画面をタップして起こそう'); this._setFarewell(false); },
  _wake: function(){
    this.state='waking'; this._set('state','waking'); this._setHint('');
    this.uppo.object3D.position.y = this.footY;   // ふわふわ上下をリセットしてから覚醒演出へ
    const done=()=>{ this.leaves.querySelectorAll('a-entity').forEach(l=>l.emit('bloom'));
      this.roses.querySelectorAll('a-entity').forEach(r=>r.emit('bloom'));
      const ms=200+this.roses.querySelectorAll('a-entity').length*45+520;
      setTimeout(()=>this._toFarewell(), ms+200); };
    if(this.baseS==null){done();return;}
    const b=this.baseS;
    this._scaleKeys(this.uppo.object3D,[
      {t:0,s:[b,b,b]},{t:130,s:[b*1.22,b*0.72,b*1.22],e:this._easeOutQuad},
      {t:320,s:[b*0.86,b*1.24,b*0.86],e:this._easeOutQuad},{t:560,s:[b,b,b],e:this._easeOutBack}
    ],done);
  },
  _toFarewell: function(){ this.state='farewell'; this._set('state','farewell'); this._setFarewell(true); this._setHint('ゆびで回せる ・ もう一度タップ'); this._awardStamp(); },
  _reset: function(){ this.state='resetting'; this._set('state','resetting'); this._setFarewell(false);
    this.leaves.querySelectorAll('a-entity').forEach(l=>l.emit('hide'));
    this.roses.querySelectorAll('a-entity').forEach(r=>r.emit('hide'));
    setTimeout(()=>this._toSleeping(),320); },

  // ---- スタンプ帳（localStorage） ----
  _loadStamps: function(){ try{ return JSON.parse(localStorage.getItem(this.CFG.STAMP_KEY))||{}; }catch(e){ return {}; } },
  _saveStamps: function(o){ try{ localStorage.setItem(this.CFG.STAMP_KEY, JSON.stringify(o)); }catch(e){} },
  _todayStr: function(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'.'+z(d.getMonth()+1)+'.'+z(d.getDate()); },
  _awardStamp: function(){
    const store=this._loadStamps();
    const first=!(store.uppo && store.uppo.earned);
    if(first){ store.uppo={earned:true, date:this._todayStr()}; this._saveStamps(store); this._flourish(); }
    this._renderStampBook(); this._refreshStampBtn();
  },
  _refreshStampBtn: function(){ const dot=document.getElementById('stampDot'); if(!dot)return;
    const s=this._loadStamps(); dot.style.display=(s.uppo&&s.uppo.earned)?'block':'none'; },
  _flourish: function(){ const el=document.getElementById('getFx'); if(!el)return;
    const nm=el.querySelector('.gf-name'); if(nm) nm.textContent='「'+this.CFG.STAMP_NAME+'」を てにいれた！';
    el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2600); },
  _renderStampBook: function(){
    const wrap=document.getElementById('stampList'); if(!wrap)return;
    const store=this._loadStamps(), spots=this.CFG.STAMP_SPOTS;
    const got=spots.filter(sp=>store[sp.id]&&store[sp.id].earned).length;
    const cnt=document.getElementById('stampCount'); if(cnt) cnt.textContent=got+' / '+spots.length;
    wrap.innerHTML='';
    spots.forEach(sp=>{
      const earned=store[sp.id]&&store[sp.id].earned;
      const item=document.createElement('div');
      item.className='sb-item'+(earned?' got':(sp.live?'':' soon'));
      const disc=earned?'✓':(sp.live?'？':'近日');
      const date=earned?('獲得 '+store[sp.id].date):(sp.live?'まだ':'これから');
      item.innerHTML='<div class="sb-disc">'+disc+'</div><div class="sb-meta"><div class="sb-name">'+sp.name+'</div><div class="sb-date">'+date+'</div></div>';
      wrap.appendChild(item);
    });
  },
  _openBook: function(){ this._renderStampBook(); const s=document.getElementById('stampSheet');
    if(s){ s.style.display='flex'; requestAnimationFrame(()=>s.classList.add('open')); } },
  _closeBook: function(){ const s=document.getElementById('stampSheet');
    if(s){ s.classList.remove('open'); setTimeout(()=>{ s.style.display='none'; },300); } },

  tick: function(time, dt){
    if(this.baseS==null || !this.el.object3D.visible) return;
    const C=this.CFG, now=performance.now();
    const resting = (this.state==='sleeping' || this.state==='farewell');
    // ① 放置中はゆっくり自動回転（指を離して少し経つと再開）
    if(resting && !this._down && now > this._autoResumeAt){
      this.spinY += C.AUTO_SPIN * ((dt||16)/1000);
    }
    // ① 回転（スワイプ＋自動）をウッポ・若葉・バラにまとめて適用＝一緒に回る
    this.uppo.object3D.rotation.y   = this.spinY;
    this.leaves.object3D.rotation.y = this.spinY;
    this.roses.object3D.rotation.y  = this.spinY;
    // ① ふわふわ上下＋（眠り中の）呼吸。覚醒・リセットの演出中はいじらない
    if(resting){
      this.uppo.object3D.position.y = this.footY + C.BOB_AMP * Math.sin(now/1000 * C.BOB_SPEED);
      const s = (this.state==='sleeping') ? this.baseS*(1+0.03*Math.sin(now/520)) : this.baseS;
      this.uppo.object3D.scale.set(s,s,s);
    }
  },

  _easeOutQuad:function(t){return 1-(1-t)*(1-t);},
  _easeOutBack:function(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  _scaleKeys:function(obj,keys,done){let i=0;const seg=()=>{if(i>=keys.length-1){if(done)done();return;}
    const a=keys[i],b=keys[i+1],dur=b.t-a.t,ease=b.e||(x=>x),t0=performance.now();
    const step=(now)=>{let p=dur<=0?1:Math.min(1,(now-t0)/dur);const e=ease(p);
      obj.scale.set(a.s[0]+(b.s[0]-a.s[0])*e,a.s[1]+(b.s[1]-a.s[1])*e,a.s[2]+(b.s[2]-a.s[2])*e);
      if(p<1)requestAnimationFrame(step);else{i++;seg();}};requestAnimationFrame(step);};seg();},

  _setHint:function(t){const el=document.getElementById('hint');if(!el)return;if(t){el.textContent=t;el.style.opacity='1';}else el.style.opacity='0';},
  _setFarewell:function(on){const el=document.getElementById('farewell');if(el)el.style.opacity=on?'1':'0';},
  _set:function(k,v){this.dbg[k]=v;this._renderDbg();},
  _renderDbg:function(){if(!this.CFG.DEBUG)return;const el=document.getElementById('debug');if(!el)return;el.style.display='block';
    el.textContent=`ビルド: v15 ✅（回転＋距離）\nカメラ: ${this.dbg.AR}\nモデル: ${this.dbg.model}\nマーカー: ${this.dbg.target}\n状態: ${this.dbg.state}`;},
});

</script>
<style>
  :root{--washi:#efe7d6;--washi2:#f5efe1;--ink:#2b2622;--bark:#7a5230;--leaf:#6a9a3f;--rose:#b0202f;--gold:#b8892b;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;font-family:"Zen Maru Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:none;}
  a-scene{position:fixed;inset:0;z-index:1;}
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;}
  #title{position:absolute;top:calc(env(safe-area-inset-top,0) + 14px);left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:17px;letter-spacing:.06em;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #title small{display:block;font-weight:500;font-size:12px;opacity:.9;margin-top:2px;letter-spacing:.14em;}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0) + 26px);background:rgba(43,38,34,.86);color:#f5efe1;font-weight:700;font-size:16px;padding:12px 22px;border-radius:999px;border:1.5px solid rgba(245,239,225,.35);box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .4s;white-space:nowrap;}
  #farewell{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0) + 60px);transform:translateX(-50%);width:min(82vw,340px);text-align:center;opacity:0;transition:opacity .6s;background:linear-gradient(180deg,var(--washi2),var(--washi));color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:22px 20px 18px;box-shadow:0 12px 34px rgba(0,0,0,.4);}
  #farewell .fw-lead{font-weight:700;font-size:19px;line-height:1.7;}
  #farewell .fw-sub{margin-top:12px;font-family:"Shippori Mincho",serif;font-weight:600;font-size:13px;color:var(--bark);letter-spacing:.04em;}

  #farewell .strip i{width:34px;height:5px;border-radius:2px;display:block;}
  #debug{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0) + 56px);display:none;background:rgba(0,0,0,.62);color:#9effa0;font-family:ui-monospace,monospace;font-size:12px;line-height:1.5;white-space:pre;padding:8px 10px;border-radius:8px;border:1px solid rgba(158,255,160,.3);}
  #start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:26px;transition:opacity .4s;background:radial-gradient(120% 90% at 50% 0%, #f6f0e2 0%, var(--washi) 55%, #e7dcc6 100%);}
  #card{width:min(92vw,420px);border:2px solid var(--ink);border-radius:6px;padding:8px;background:var(--washi2);box-shadow:0 18px 50px rgba(0,0,0,.28);}

  #card h1{margin:0;font-weight:700;font-size:44px;color:var(--ink);letter-spacing:.1em;line-height:1.05;}

  #card .strip i{width:52px;height:6px;border-radius:2px;display:block;}
  #card p.lead{font-size:13.5px;color:#5a4c3d;line-height:1.9;margin:0 0 22px;}
  #startBtn{pointer-events:auto;cursor:pointer;border:none;font-family:inherit;background:var(--ink);color:var(--washi2);font-weight:700;font-size:18px;padding:15px 40px;border-radius:999px;letter-spacing:.08em;box-shadow:0 8px 0 #17130f,0 14px 24px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;}

  #startBtn:disabled{opacity:.5;cursor:default;box-shadow:0 8px 0 #17130f,0 14px 24px rgba(0,0,0,.3);transform:none;}
  #startBtn .k{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:3px;letter-spacing:.16em;}
  #note{margin-top:16px;font-size:11.5px;color:var(--gold);font-weight:500;letter-spacing:.1em;}
  .strip .c-bark{background:var(--bark);} .strip .c-leaf{background:var(--leaf);} .strip .c-rose{background:var(--rose);}

  #stampBtn{position:absolute;left:calc(env(safe-area-inset-left,0) + 12px);top:calc(env(safe-area-inset-top,0) + 12px);z-index:12;pointer-events:auto;cursor:pointer;border:1.5px solid rgba(245,239,225,.5);background:rgba(43,38,34,.86);color:#f5efe1;font-family:inherit;font-weight:700;font-size:13px;letter-spacing:.06em;padding:9px 14px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.35);}

  #getFx .gf-name{font-weight:700;font-size:17px;color:var(--ink);}
  #getFx .gf-sub{font-family:"Shippori Mincho",serif;font-size:12px;color:var(--bark);margin-top:6px;}
  #stampSheet{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(20,16,12,.55);opacity:0;transition:opacity .3s;pointer-events:auto;}
  #stampSheet.open{opacity:1;}
  .sb-card{width:min(90vw,380px);max-height:86vh;overflow:auto;background:linear-gradient(180deg,var(--washi2),var(--washi));color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.45);transform:translateY(12px);transition:transform .3s;}
  #stampSheet.open .sb-card{transform:translateY(0);}
  .sb-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  .sb-title{font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--ink);}
  .sb-kicker{font-family:"Shippori Mincho",serif;font-weight:600;font-size:12px;color:var(--bark);margin-top:2px;letter-spacing:.04em;}
  .sb-count{text-align:right;font-weight:700;font-size:18px;color:var(--rose);line-height:1.1;}
  .sb-count small{display:block;font-size:10px;color:var(--bark);font-weight:500;letter-spacing:.08em;margin-top:2px;}
  .sb-strip{display:flex;gap:5px;margin:12px 0 14px;}
  .sb-strip i{height:5px;flex:1;border-radius:2px;}
  .sb-strip .c-bark{background:var(--bark);}.sb-strip .c-leaf{background:var(--leaf);}.sb-strip .c-rose{background:var(--rose);}
  #stampList{display:flex;flex-direction:column;gap:10px;}
  .sb-item{display:flex;align-items:center;gap:14px;border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--washi2);}
  .sb-item .sb-disc{width:46px;height:46px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border:2px solid var(--ink);color:var(--ink);}
  .sb-item.got{border-color:var(--leaf);}
  .sb-item.got .sb-disc{background:var(--leaf);color:#fff;border-color:var(--leaf);box-shadow:0 0 0 3px rgba(106,154,63,.25);}
  .sb-item.soon{opacity:.62;}
  .sb-item.soon .sb-disc{border-style:dashed;color:var(--bark);font-size:11px;background:transparent;}
  .sb-name{font-weight:700;font-size:15px;color:var(--ink);}
  .sb-date{font-size:11px;color:var(--bark);margin-top:2px;font-weight:500;}
  .sb-foot{font-family:"Shippori Mincho",serif;font-size:11.5px;color:#5a4c3d;line-height:1.8;margin:14px 0 16px;}
  #stampClose{display:block;width:100%;pointer-events:auto;cursor:pointer;border:none;font-family:inherit;background:var(--ink);color:var(--washi2);font-weight:700;font-size:15px;padding:12px;border-radius:999px;letter-spacing:.08em;}
  video{position:fixed !important;top:0 !important;left:0 !important;width:100% !important;height:100% !important;object-fit:cover !important;z-index:0 !important;}
  .a-canvas{z-index:1 !important;}
</style>
</head>
<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind?v=3; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"

    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
    vr-mode-ui="enabled: false"

    <a-entity light="type: directional; color: #fff; intensity: 0.55" position="1 2 1.5"></a-entity>

    <a-entity id="target" mindar-image-target="targetIndex: 0" uppo-experience>
      <a-entity id="stage" rotation="0 0 0" scale="0.6 0.6 0.6">
        <a-entity id="uppo" gltf-model="#uppoModel"></a-entity>
        <a-entity id="leaves" position="0 1.05 0"></a-entity>
        <a-entity id="roses"  position="0 0 0"></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="hud">
    <div id="title">ウッポ<small>〜 靱公園のねむり番 〜</small></div>
    <div id="debug"></div>
    <div id="hint" style="opacity:0">マーカーカードにかざしてね</div>
    <div id="farewell">
      <div class="fw-lead">ありがとう。<br>また、ここで ねむっているね。</div>
      <div class="fw-sub">── 物語が、木を守る。</div>
      <div class="strip"><i class="c-bark"></i><i class="c-leaf"></i><i class="c-rose"></i></div>
    </div>

    <button id="stampBtn">スタンプ帳<span id="stampDot"></span></button>

    <div id="getFx">
      <div class="gf-card">
        <div class="gf-seal">印</div>
        <div class="gf-name"></div>
        <div class="gf-sub">やり切った しるし</div>
      </div>
    </div>

    <div id="stampSheet">
      <div class="sb-card">
        <div class="sb-head">
          <div>
            <div class="sb-title">スタンプ帳</div>
            <div class="sb-kicker">靱公園 ねむり番めぐり</div>

        <div class="sb-strip"><i class="c-bark"></i><i class="c-leaf"></i><i class="c-rose"></i></div>
        <div id="stampList"></div>
        <p class="sb-foot">① 御神木で ウッポを 起こすと 印が おされるよ。<br>ほかの スポットは これから ふえていく よてい。</p>
        <button id="stampClose">とじる</button>
      </div>
    </div>
  </div>

  <div id="start">
    <div id="card"><div class="inner">
      <h1>ウッポ</h1>
      <div class="sub">〜 靱公園のねむり番 〜</div>
      <div class="strip"><i class="c-bark"></i><i class="c-leaf"></i><i class="c-rose"></i></div>
      <p class="lead">靱公園の御神木で、眠る木霊にそっと触れると、<br>目を覚まし、若葉が芽吹き、バラが咲き広がる。</p>
      <button id="startBtn">はじめる<span class="k">カメラを ゆるして ください</span></button>
      <div id="note">靱公園AR ・ WebXRで、木霊にふれる</div>
    </div></div>
  </div>
